name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: pitchmate
          POSTGRES_PASSWORD: isolated-ci-database
          POSTGRES_DB: pitchmate_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pitchmate -d pitchmate_test"
          --health-interval 5s --health-timeout 3s --health-retries 15
    env:
      DATABASE_URL: postgresql://pitchmate:isolated-ci-database@127.0.0.1:5432/pitchmate_app
      TEST_DATABASE_URL: postgresql://pitchmate:isolated-ci-database@127.0.0.1:5432/pitchmate_test
      AUTH_SECRET: isolated-ci-session-secret-without-external-privileges
      APP_URL: http://localhost:3000
      LOG_LEVEL: error
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: DATABASE_URL="$TEST_DATABASE_URL" bun run db:migrate:deploy
      - run: bun run format:check
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test:unit
      - run: bun run test:integration
      - run: bun run test:security
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:e2e --reporter=line,html
        env:
          PLAYWRIGHT_HTML_OPEN: never
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-result
          path: |
            test-results
            playwright-report
          retention-days: 7
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: docker run --rm -v "$PWD:/src:ro" ghcr.io/gitleaks/gitleaks:v8.30.0 git --redact /src
      - run: docker run --rm -v "$PWD:/src:ro" semgrep/semgrep:1.151.0 semgrep scan --metrics off --config /src/.semgrep.yml --error /src/src
      - run: docker build --tag pitchmate-ci .
      - run: |
          docker save pitchmate-ci --output "$RUNNER_TEMP/pitchmate-image.tar"
          docker run --rm -v "$RUNNER_TEMP:/scan:ro" aquasec/trivy:0.69.3 image --input /scan/pitchmate-image.tar --severity CRITICAL,HIGH --exit-code 1
